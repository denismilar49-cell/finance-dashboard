<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Finance Dashboard Pro</title>

<link rel="stylesheet" href="style.css">

<!-- Chart.js -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>

<div class="app">

<!-- SIDEBAR -->
<div class="sidebar">
<h2>💰 Finance Pro</h2>

<button onclick="setTab('home', this)" class="active">🏠 Home</button>
<button onclick="setTab('business', this)">🏢 Бізнес</button>
<button onclick="setTab('auto', this)">🚗 Авто</button>
<button onclick="setTab('items', this)">📦 Предмети</button>
</div>

<!-- MAIN -->
<div class="main">

<h1>Фінансовий дашборд</h1>

<div class="grid">
<div class="card">Угоди <p id="count">0</p></div>
<div class="card green">Прибуток <p id="profit">$0</p></div>
<div class="card">Середній <p id="avg">$0</p></div>
<div class="card">Найкраща <p id="best">—</p></div>
</div>

<canvas id="chart"></canvas>

<div class="form">
<input id="name" placeholder="Назва">
<input id="buy" type="number" placeholder="Купівля">
<input id="sell" type="number" placeholder="Продаж">
<button onclick="addDeal()">Додати</button>
</div>

<div id="list"></div>

</div>
</div>

<script src="script.js"></script>
</body>
</html>
