<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Finance Dashboard</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="app">

<div class="sidebar">
<h2>💰 Dashboard</h2>

<button onclick="setTab('home', event)" class="active">🏠 Дім</button>
<button onclick="setTab('business', event)">🏢 Бізнес</button>
<button onclick="setTab('auto', event)">🚗 Авто</button>
<button onclick="setTab('items', event)">📦 Предмети</button>
</div>

<div class="main">

<h1>Фінансовий дашборд</h1>

<!-- STATS -->
<div class="grid">
<div class="card"><h3>Угоди</h3><p id="count">0</p></div>
<div class="card"><h3>Прибуток</h3><p id="profit">$0</p></div>
<div class="card"><h3>Середній</h3><p id="avg">$0</p></div>
<div class="card"><h3>Найкраща</h3><p id="best">—</p></div>
</div>

<!-- CHART -->
<canvas id="chart"></canvas>

<!-- FORM -->
<div class="form">
<input id="name" placeholder="Назва">
<input id="buy" type="number" placeholder="Купівля">
<input id="sell" type="number" placeholder="Продаж">
<button onclick="addDeal()">Додати</button>
</div>

<!-- LIST -->
<div id="list"></div>

</div>
</div>

<script src="script.js"></script>
</body>
</html>
